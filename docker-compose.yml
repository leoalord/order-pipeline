services:
  postgres:
    image: postgres:16
    ports:
      # Loopback-only, non-default host port: the direct-session tests need a
      # DSN from the host, and 5432 is often already taken by a local Postgres.
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_pipeline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_pipeline"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/order_pipeline
      API_RESTAURANT_ADMIN_URL: http://restaurant:8081
      API_COURIER_ADMIN_URL: http://courier:8082
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  restaurant:
    build: .
    command: ["restaurant-sim"]
    ports:
      - "8081:8081"
    environment:
      SKIP_MIGRATIONS: "1"
      RSIM_LEDGER_PATH: /var/lib/restaurant/ledger.sqlite
    volumes:
      - restaurant_ledger:/var/lib/restaurant
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  courier:
    build: .
    command: ["courier-sim"]
    ports:
      - "8082:8082"
    environment:
      SKIP_MIGRATIONS: "1"
      CSIM_LEDGER_PATH: /var/lib/courier/ledger.sqlite
    volumes:
      - courier_ledger:/var/lib/courier
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  worker:
    build: .
    command: ["worker"]
    # Health stays on container 8083 so compose --wait is real. Do not publish
    # 8083 to the host — two replicas cannot both bind it. `ps -q worker` → 2.
    environment:
      SKIP_MIGRATIONS: "1"
      WORKER_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/order_pipeline
      WORKER_RESTAURANT_BASE_URL: http://restaurant:8081
      WORKER_COURIER_BASE_URL: http://courier:8082
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      restaurant:
        condition: service_healthy
      courier:
        condition: service_healthy
    restart: "no"
    deploy:
      replicas: 2
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  loadgen:
    build: .
    command: ["loadgen"]
    ports:
      - "8090:8090"
    environment:
      SKIP_MIGRATIONS: "1"
      LOADGEN_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    environment:
      # Vite *server* proxy wiring — not VITE_ client knobs. The browser talks
      # same-origin `/snapshot` `/loadgen` `/rsim` `/csim`.
      API_PROXY_TARGET: http://api:8000
      LOADGEN_PROXY_TARGET: http://loadgen:8090
      RSIM_PROXY_TARGET: http://restaurant:8081
      CSIM_PROXY_TARGET: http://courier:8082
    depends_on:
      api:
        condition: service_healthy
      restaurant:
        condition: service_healthy
      courier:
        condition: service_healthy
      loadgen:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
  restaurant_ledger:
  courier_ledger:
